[versions]
agp = "8.3.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
room = "2.6.1"
recyclerview = "1.3.2"
viewpager = "1.0.0"
fragment = "1.6.2"
palette = "1.0.0"
work = "2.9.0"
documentfile = "1.0.1"
lifecycle = "2.7.0"
coroutines = "1.8.0"
appcompat = "1.6.1"
activity-ktx = "1.8.2"
material = "1.11.0"
