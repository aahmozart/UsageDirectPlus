prettytime = { module = "org.ocpsoft.prettytime:prettytime", version.ref = "prettytime" }
pikolo = { module = "com.github.madrapps:pikolo", version.ref = "pikolo" }
typedRecyclerView = { module = "org.codeberg.fynngodau:TypedRecyclerView", version.ref = "typedRecyclerView" }
librariesDirect = { module = "org.codeberg.fynngodau:librariesDirect", version.ref = "librariesDirect" }
chartDirect = { module = "org.codeberg.fynngodau:chartDirect", version.ref = "chartDirect" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android = { module = "io.mockk:mockk-android", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines-test" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
