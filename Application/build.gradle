
buildscript {
    repositories {
        jcenter()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

plugins {
    id 'org.jetbrains.kotlin.android' version '1.8.10'
}
apply plugin: 'com.android.application'

repositories {
    jcenter()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.fragment:fragment:1.6.1'
    implementation 'androidx.palette:palette:1.0.0'


    implementation 'com.ogaclejapan.smarttablayout:library:2.0.0@aar'
    implementation 'org.ocpsoft.prettytime:prettytime:4.0.5.Final'
    implementation 'com.github.madrapps:pikolo:2.0.1'

    implementation 'org.codeberg.fynngodau:TypedRecyclerView:bd4bfaa4ef'
    implementation 'org.codeberg.fynngodau:librariesDirect:3e000cf3ff'
    implementation 'org.codeberg.fynngodau:chartDirect:2.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    def room_version = "2.5.2"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

}

android {
    compileSdkVersion 33

    namespace 'godau.fynn.usagedirect'

    defaultConfig {
        applicationId "godau.fynn.usagedirect"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 9
        versionName "0.8"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation":
                                      "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
    }

    flavorDimensions "source"
    productFlavors {
        system {
            dimension "source"
            applicationIdSuffix ".system"
        }
        database {
            dimension "source"
        }
    }

    compileOptions {

        // This is for using certain useful java.time.* calls
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}
