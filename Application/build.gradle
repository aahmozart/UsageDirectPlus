
buildscript {
    repositories {
        jcenter()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:4.0.1'
    }
}

apply plugin: 'com.android.application'

repositories {
    jcenter()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation "androidx.fragment:fragment:1.2.5"

    implementation 'org.ocpsoft.prettytime:prettytime:4.0.5.Final'
    implementation 'org.codeberg.fynngodau:librariesDirect:2.1'
    implementation 'com.github.fynngodau:AndroidCharts:1.1.1'
    implementation 'com.ogaclejapan.smarttablayout:library:2.0.0@aar'
    implementation 'org.codeberg.fynngodau:TypedRecyclerView:1.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.0.10'

    def room_version = "2.2.5"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

}

android {
    compileSdkVersion 29

    buildToolsVersion "28.0.3"

    defaultConfig {
        applicationId "godau.fynn.usagedirect"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 6
        versionName "0.5"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation":
                                      "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix " debug"
            applicationIdSuffix ".debug"
        }
    }

    flavorDimensions "source"
    productFlavors {
        system {
            dimension "source"
            applicationIdSuffix ".system"
        }
        database {
            dimension "source"
        }
    }

    compileOptions {

        // This is for using certain useful java.time.* calls
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}
