name: CI Release

on:
  workflow_run:
    workflows: [CI Build]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release-apk:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get latest tag
        id: tag
        run: |
          TAG=$(gh api repos/${{ github.repository }}/tags --jq '.[0].name' 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.tag.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        if: steps.tag.outputs.skip != 'true' && env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.jks"
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APKs
        if: steps.tag.outputs.skip != 'true' && env.KEYSTORE_FILE != ''
        run: ./gradlew :Application:assembleDatabaseRelease :Application:assembleSystemRelease

      - name: Build debug APKs (no signing key)
        if: steps.tag.outputs.skip != 'true' && env.KEYSTORE_FILE == ''
        run: ./gradlew :Application:assembleDatabaseDebug :Application:assembleSystemDebug

      - name: Rename APKs
        if: steps.tag.outputs.skip != 'true'
        id: apks
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          mkdir -p release-apks

          if [ -n "${KEYSTORE_FILE:-}" ]; then
            BUILD_TYPE="release"
          else
            BUILD_TYPE="debug"
          fi

          find Application/build/outputs/apk -name "*.apk" -type f | while read apk; do
            if echo "$apk" | grep -q "database"; then
              cp "$apk" "release-apks/usageDirectPlus-database-${VERSION}.apk"
            elif echo "$apk" | grep -q "system"; then
              cp "$apk" "release-apks/usageDirectPlus-system-${VERSION}.apk"
            fi
          done

          ls -la release-apks/
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: release-apks/*.apk
